<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wine Cupboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen pb-16 font-sans">

    <!-- Header -->
    <header class="bg-amber-950 text-stone-100 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-wine-bottle text-amber-400 text-xl"></i>
                <h1 class="font-bold text-lg tracking-wide">My Wine Cupboard</h1>
            </div>
            <button onclick="openAddModal()" class="bg-amber-700 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium shadow transition flex items-center space-x-1">
                <i class="fa-solid fa-plus"></i><span>Add Bottle</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 py-4 space-y-4">

        <!-- Stats / Dashboard Bar -->
        <section class="grid grid-cols-3 gap-2 bg-white p-3 rounded-xl shadow-sm border border-stone-200 text-center">
            <div>
                <span class="block text-xs text-stone-500 uppercase tracking-wider">Total Bottles</span>
                <span id="statTotal" class="text-xl font-bold text-amber-950">0</span>
            </div>
            <div class="border-x border-stone-100">
                <span class="block text-xs text-stone-500 uppercase tracking-wider">Types</span>
                <span id="statTypes" class="text-xl font-bold text-amber-950">0</span>
            </div>
            <div>
                <span class="block text-xs text-stone-500 uppercase tracking-wider">Cupboard %</span>
                <span id="statCapacity" class="text-xl font-bold text-amber-950">0%</span>
            </div>
        </section>

        <!-- Search & Filters -->
        <section class="space-y-2">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-stone-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterWines()" placeholder="Search name, region, year..." class="w-full pl-10 pr-4 py-2 bg-white border border-stone-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-800">
            </div>
            <div class="flex space-x-2 overflow-x-auto pb-1 text-xs scrollbar-hide">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3 py-1.5 rounded-full bg-amber-900 text-white font-medium whitespace-nowrap shadow-sm">All</button>
                <button onclick="setFilter('Red')" id="filter-Red" class="filter-btn px-3 py-1.5 rounded-full bg-stone-200 text-stone-700 font-medium whitespace-nowrap">Red</button>
                <button onclick="setFilter('White')" id="filter-White" class="filter-btn px-3 py-1.5 rounded-full bg-stone-200 text-stone-700 font-medium whitespace-nowrap">White</button>
                <button onclick="setFilter('Rosé')" id="filter-Rosé" class="filter-btn px-3 py-1.5 rounded-full bg-stone-200 text-stone-700 font-medium whitespace-nowrap">Rosé</button>
                <button onclick="setFilter('Sparkling')" id="filter-Sparkling" class="filter-btn px-3 py-1.5 rounded-full bg-stone-200 text-stone-700 font-medium whitespace-nowrap">Sparkling</button>
            </div>
        </section>

        <!-- Wine List -->
        <section id="wineList" class="space-y-3">
            <!-- Dynamically populated -->
        </section>

        <!-- Google Sheet Fail-Safe Backup Tools -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 space-y-3">
            <div class="flex items-center space-x-2 text-amber-950 font-semibold text-xs uppercase tracking-wider">
                <i class="fa-solid fa-file-excel text-green-700 text-sm"></i>
                <span>Google Sheets Backup</span>
            </div>
            <p class="text-xs text-stone-500">Download your cupboard backup to drop into your master Google Sheet, or upload a backup CSV.</p>
            
            <div class="grid grid-cols-2 gap-2">
                <button onclick="exportToGoogleSheetCSV()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 py-2 px-3 rounded-lg text-xs font-medium border border-stone-300 flex items-center justify-center space-x-1.5 transition">
                    <i class="fa-solid fa-download"></i><span>Download CSV</span>
                </button>
                <label class="cursor-pointer bg-amber-900 hover:bg-amber-800 text-white py-2 px-3 rounded-lg text-xs font-medium flex items-center justify-center space-x-1.5 shadow transition">
                    <i class="fa-solid fa-upload"></i><span>Upload Backup</span>
                    <input type="file" accept=".csv" onchange="importSheetCSV(event)" class="hidden">
                </label>
            </div>
            <div class="pt-1">
                <a href="https://docs.google.com/spreadsheets/d/1hgITkZz9nin9tQkhMe6syKrZlIRfuFpBGQq9fOgw8DI/edit?usp=drivesdk" target="_blank" class="w-full bg-green-700 hover:bg-green-600 text-white py-2 px-3 rounded-lg text-xs font-medium flex items-center justify-center space-x-1.5 shadow block text-center transition">
                    <i class="fa-solid fa-external-link-alt"></i><span>Open My Master Google Sheet</span>
                </a>
            </div>
        </section>

        <!-- Footer options -->
        <section class="pt-2 flex justify-between items-center text-xs text-stone-500 px-1">
            <button onclick="loadSampleData()" class="hover:text-amber-900 underline flex items-center space-x-1">
                <i class="fa-solid fa-rotate"></i><span>Load Sample Data</span>
            </button>
            <button onclick="clearAllData()" class="text-red-600 hover:underline flex items-center space-x-1">
                <i class="fa-solid fa-trash"></i><span>Reset Cupboard</span>
            </button>
        </section>
    </main>

    <!-- Add/Edit Modal -->
    <div id="wineModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto shadow-xl">
            <div class="flex justify-between items-center border-b border-stone-100 pb-3">
                <h3 id="modalTitle" class="font-bold text-lg text-amber-950">Add New Bottle</h3>
                <button onclick="closeModal()" class="text-stone-400 hover:text-stone-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="wineForm" onsubmit="saveWine(event)" class="space-y-3">
                <input type="hidden" id="wineId">
                
                <!-- Camera Photo Capture with AI Scan -->
                <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 space-y-2">
                    <label class="block text-xs font-bold text-amber-950 uppercase tracking-wider">AI Label Scanner</label>
                    <div class="flex items-center space-x-3">
                        <label class="cursor-pointer bg-amber-900 hover:bg-amber-800 text-white px-3 py-2 rounded-lg text-xs font-medium shadow flex items-center space-x-1.5 transition">
                            <i class="fa-solid fa-camera"></i><span>Snap & Auto-Fill</span>
                            <input type="file" accept="image/*" capture="environment" onchange="handleImageScan(event)" class="hidden">
                        </label>
                        <span id="photoStatus" class="text-xs text-amber-900 italic">Take a photo to auto-fill details</span>
                    </div>
                    <input type="hidden" id="winePhoto">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Wine Name / Label *</label>
                    <input type="text" id="wineName" required placeholder="e.g. Côtes du Rhône" class="w-full p-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 mb-1">Type *</label>
                        <select id="wineType" class="w-full p-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                            <option value="Red">Red</option>
                            <option value="White">White</option>
                            <option value="Rosé">Rosé</option>
                            <option value="Sparkling">Sparkling</option>
                            <option value="Dessert">Dessert</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 mb-1">Vintage (Year)</label>
                        <input type="number" id="wineYear" placeholder="e.g. 2020" class="w-full p-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 mb-1">Quantity</label>
                        <input type="number" id="wineQty" value="1" min="1" max="50" class="w-full p-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 mb-1">Cupboard Shelf</label>
                        <input type="text" id="wineLocation" placeholder="e.g. Top Shelf, Back" class="w-full p-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Notes / Food Pairing</label>
                    <textarea id="wineNotes" rows="2" placeholder="e.g. Good with pasta, gift from Sarah" class="w-full p-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none"></textarea>
                </div>

                <div class="pt-3 flex space-x-3">
                    <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 border border-stone-300 rounded-lg text-sm font-medium text-stone-700 hover:bg-stone-50 transition">Cancel</button>
                    <button type="submit" class="w-1/2 py-2.5 bg-amber-900 text-white rounded-lg text-sm font-medium hover:bg-amber-800 shadow transition">Save Bottle</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-stone-900 text-stone-100 px-4 py-2 rounded-xl text-xs shadow-lg transition-all opacity-0 pointer-events-none z-50 whitespace-nowrap">
        Action completed successfully
    </div>

    <style>
        /* Hide scrollbar for category filters */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script>
        let wines = JSON.parse(localStorage.getItem('wine_cupboard_data')) || [];
        let currentFilter = 'all';
        const apiKey = "";

        renderWines();

        function saveToStorage() {
            localStorage.setItem('wine_cupboard_data', JSON.stringify(wines));
            renderWines();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2500);
        }

        function renderWines() {
            const listEl = document.getElementById('wineList');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = wines.filter(w => {
                const matchesType = (currentFilter === 'all' || w.type === currentFilter);
                const matchesSearch = w.name.toLowerCase().includes(searchVal) || 
                                      (w.notes && w.notes.toLowerCase().includes(searchVal)) ||
                                      (w.year && w.year.toString().includes(searchVal)) ||
                                      (w.location && w.location.toLowerCase().includes(searchVal));
                return matchesType && matchesSearch;
            });

            const totalBottles = wines.reduce((acc, curr) => acc + parseInt(curr.qty || 1), 0);
            const uniqueTypes = new Set(wines.map(w => w.type)).size;
            document.getElementById('statTotal').innerText = totalBottles;
            document.getElementById('statTypes').innerText = uniqueTypes;
            document.getElementById('statCapacity').innerText = Math.min(100, Math.round((totalBottles / 100) * 100)) + '%';

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-10 bg-white rounded-xl border border-stone-200">
                        <i class="fa-solid fa-wine-glass-empty text-3xl text-stone-300 mb-2"></i>
                        <p class="text-sm text-stone-500 mt-2">Your cupboard is empty.</p>
                        <p class="text-xs text-stone-400 mt-1">Tap 'Add Bottle' or upload your sheet backup.</p>
                    </div>`;
                return;
            }

            listEl.innerHTML = filtered.map(wine => `
                <div class="bg-white p-3.5 rounded-xl shadow-sm border border-stone-200 flex items-center justify-between">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="w-12 h-12 rounded-lg bg-amber-50 border border-amber-200 flex items-center justify-center text-amber-900 font-bold text-lg shrink-0 overflow-hidden shadow-inner">
                            ${wine.photo ? `<img src="${wine.photo}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-wine-bottle"></i>`}
                        </div>
                        <div class="min-w-0">
                            <div class="flex items-center space-x-2">
                                <h4 class="font-semibold text-stone-900 text-sm truncate">${wine.name}</h4>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-medium shrink-0 ${getTypeBadgeColor(wine.type)}">${wine.type}</span>
                            </div>
                            <p class="text-xs text-stone-500 mt-0.5 truncate">
                                ${wine.year ? wine.year + ' • ' : ''} ${wine.location || 'General Cupboard'}
                            </p>
                            ${wine.notes ? `<p class="text-[11px] text-stone-400 italic mt-1 line-clamp-1">${wine.notes}</p>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0 pl-2">
                        <div class="text-center px-2 py-1 bg-stone-100 rounded-lg min-w-[2.5rem]">
                            <span class="block text-[10px] text-stone-500 uppercase tracking-wide">Qty</span>
                            <span class="font-bold text-sm text-amber-950">${wine.qty}</span>
                        </div>
                        <div class="flex flex-col space-y-1">
                            <button onclick="adjustQty('${wine.id}', 1)" class="w-7 h-6 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded flex items-center justify-center text-xs transition"><i class="fa-solid fa-plus"></i></button>
                            <button onclick="adjustQty('${wine.id}', -1)" class="w-7 h-6 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded flex items-center justify-center text-xs transition"><i class="fa-solid fa-minus"></i></button>
                        </div>
                        <button onclick="editWine('${wine.id}')" class="p-2 text-stone-400 hover:text-stone-700 transition"><i class="fa-solid fa-pen text-sm"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function getTypeBadgeColor(type) {
            switch(type) {
                case 'Red': return 'bg-red-100 text-red-800 border border-red-200';
                case 'White': return 'bg-yellow-100 text-yellow-800 border border-yellow-200';
                case 'Rosé': return 'bg-pink-100 text-pink-800 border border-pink-200';
                case 'Sparkling': return 'bg-amber-100 text-amber-900 border border-amber-200';
                default: return 'bg-stone-100 text-stone-800 border border-stone-200';
            }
        }

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-3 py-1.5 rounded-full bg-stone-200 text-stone-700 font-medium whitespace-nowrap transition";
            });
            document.getElementById(`filter-${type}`).className = "filter-btn px-3 py-1.5 rounded-full bg-amber-900 text-white font-medium whitespace-nowrap shadow-sm transition";
            renderWines();
        }

        function filterWines() {
            renderWines();
        }

        function adjustQty(id, amount) {
            const wine = wines.find(w => w.id === id);
            if (wine) {
                wine.qty = Math.max(0, parseInt(wine.qty) + amount);
                if (wine.qty === 0) {
                    wines = wines.filter(w => w.id !== id);
                    showToast(`Finished bottle removed`);
                } else {
                    showToast(`Quantity updated to ${wine.qty}`);
                }
                saveToStorage();
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'Add New Bottle';
            document.getElementById('wineForm').reset();
            document.getElementById('wineId').value = '';
            document.getElementById('winePhoto').value = '';
            document.getElementById('photoStatus').innerText = 'Take a photo to auto-fill details';
            document.getElementById('wineModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('wineModal').classList.add('hidden');
        }

        function editWine(id) {
            const wine = wines.find(w => w.id === id);
            if (!wine) return;
            document.getElementById('modalTitle').innerText = 'Edit Bottle';
            document.getElementById('wineId').value = wine.id;
            document.getElementById('wineName').value = wine.name;
            document.getElementById('wineType').value = wine.type;
            document.getElementById('wineYear').value = wine.year || '';
            document.getElementById('wineQty').value = wine.qty;
            document.getElementById('wineLocation').value = wine.location || '';
            document.getElementById('wineNotes').value = wine.notes || '';
            document.getElementById('winePhoto').value = wine.photo || '';
            document.getElementById('photoStatus').innerText = wine.photo ? 'Photo saved' : 'Take a photo to auto-fill details';
            document.getElementById('wineModal').classList.remove('hidden');
        }

        async function handleImageScan(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('photoStatus');
            statusEl.innerText = 'Scanning label with AI...';

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result.split(',')[1];
                document.getElementById('winePhoto').value = e.target.result;

                try {
                    const prompt = "Analyze this wine label. Return ONLY a JSON object with keys: name (string, wine name/producer), type (one of: Red, White, Rosé, Sparkling, Dessert), year (4-digit number or empty string), notes (short tasting notes or region description).";
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inlineData: { mimeType: file.type, data: base64Data } }
                                ]
                            }]
                        })
                    });

                    const result = await response.json();
                    const textResponse = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (textResponse) {
                        const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
                        if (jsonMatch) {
                            const wineData = JSON.parse(jsonMatch[0]);
                            if (wineData.name) document.getElementById('wineName').value = wineData.name;
                            if (wineData.type) document.getElementById('wineType').value = wineData.type;
                            if (wineData.year) document.getElementById('wineYear').value = wineData.year;
                            if (wineData.notes) document.getElementById('wineNotes').value = wineData.notes;
                            statusEl.innerText = 'Label scanned successfully!';
                            showToast('AI filled out bottle details!');
                        } else {
                            statusEl.innerText = 'Photo attached (Manual fill recommended)';
                        }
                    }
                } catch (err) {
                    statusEl.innerText = 'Photo attached';
                    showToast('Could not auto-read label, please fill manually.');
                }
            };
            reader.readAsDataURL(file);
        }

        function saveWine(e) {
            e.preventDefault();
            const id = document.getElementById('wineId').value;
            const name = document.getElementById('wineName').value;
            const type = document.getElementById('wineType').value;
            const year = document.getElementById('wineYear').value;
            const qty = parseInt(document.getElementById('wineQty').value) || 1;
            const location = document.getElementById('wineLocation').value;
            const notes = document.getElementById('wineNotes').value;
            const photo = document.getElementById('winePhoto').value;

            if (id) {
                const wine = wines.find(w => w.id === id);
                if (wine) {
                    wine.name = name;
                    wine.type = type;
                    wine.year = year;
                    wine.qty = qty;
                    wine.location = location;
                    wine.notes = notes;
                    wine.photo = photo;
                }
                showToast('Bottle updated successfully');
            } else {
                const newWine = {
                    id: Date.now().toString(),
                    name, type, year, qty, location, notes, photo
                };
                wines.push(newWine);
                showToast('Bottle added to cupboard');
            }

            saveToStorage();
            closeModal();
        }

        function exportToGoogleSheetCSV() {
            let csv = 'Name,Type,Year,Quantity,Location,Notes\n';
            wines.forEach(w => {
                // Escape quotes and wrap in quotes for CSV safety
                const safeName = w.name.replace(/"/g, '""');
                const safeNotes = (w.notes || '').replace(/"/g, '""');
                const safeLocation = (w.location || '').replace(/"/g, '""');
                csv += `"${safeName}","${w.type}","${w.year || ''}","${w.qty}","${safeLocation}","${safeNotes}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'wine_cupboard_backup.csv');
            a.click();
            showToast('Backup CSV downloaded!');
        }

        function importSheetCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                let newWines = [];

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    const row = [];
                    let inQuotes = false;
                    let currentVal = '';
                    for (let char of line) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            row.push(currentVal.trim());
                            currentVal = '';
                        } else {
                            currentVal += char;
                        }
                    }
                    row.push(currentVal.trim());

                    if (row.length >= 4 && row[0]) {
                        newWines.push({
                            id: (Date.now() + i).toString(),
                            name: row[0].replace(/^"|"$/g, '').replace(/""/g, '"'),
                            type: row[1] || 'Red',
                            year: row[2] || '',
                            qty: parseInt(row[3]) || 1,
                            location: row[4] ? row[4].replace(/^"|"$/g, '').replace(/""/g, '"') : '',
                            notes: row[5] ? row[5].replace(/^"|"$/g, '').replace(/""/g, '"') : '',
                            photo: ''
                        });
                    }
                }

                if (newWines.length > 0) {
                    wines = newWines;
                    saveToStorage();
                    showToast(`Restored ${wines.length} bottles from backup!`);
                } else {
                    showToast('Could not parse CSV format.');
                }
            };
            reader.readAsText(file);
        }

        function loadSampleData() {
            wines = [
                { id: '1', name: 'Rioja Crianza', type: 'Red', year: 2019, qty: 3, location: 'Shelf 1', notes: 'Smooth oak finish' },
                { id: '2', name: 'Sauvignon Blanc', type: 'White', year: 2022, qty: 2, location: 'Shelf 2', notes: 'Crisp and citrusy' },
                { id: '3', name: 'Prosecco DOC', type: 'Sparkling', year: 2023, qty: 4, location: 'Door rack', notes: 'Celebration bottle' }
            ];
            saveToStorage();
            showToast('Sample wines loaded');
        }

        function clearAllData() {
            if (confirm("Are you sure you want to clear your wine cupboard? This cannot be undone unless you upload a CSV backup.")) {
                wines = [];
                saveToStorage();
                showToast('Cupboard cleared');
            }
        }
    </script>
</body>
</html>
